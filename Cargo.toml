[workspace]
members = ["tests", "crates/*", "crates/orchestrator", "crates/stack", "crates/receipt", "fuzz"]
exclude = ["crates/scenarios"]
resolver = "2"

[workspace.metadata.dylint]
libraries = [
    { path = "lints/no_unwrap_in_domain" },
    { path = "lints/domain_no_infra_import" },
    { path = "lints/ddd_boundary_violation" },
    { path = "lints/typestate_required" },
]

[workspace.dependencies]
cucumber = { version = "0.21", features = ["macros"] }
# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"
toml_edit = "0.22"

# HTTP client
reqwest = { version = "0.12", features = ["json"] }

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Database
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Random
rand = "0.9"

# Collections & functional
im = { version = "15.1", features = ["serde"] }
itertools = "0.13"
tap = "1.0"

# String utilities
strum = { version = "0.26", features = ["derive"] }

# File system
directories = "6"
fs4 = { version = "0.12", features = ["tokio"] }
notify = "6"
notify-debouncer-mini = "0.4"
walkdir = "2"

# Parsing
regex = "1.11"

# Process
which = "6.0"

# Graph algorithms
petgraph = "0.6"

# Git
gix = { version = "0.78", features = ["status", "blocking-network-client"] }

uuid = { version = "1", features = ["v4", "serde"] }

# Path utilities
pathdiff = "0.2"

# URL parsing
url = "2"

# TUI
ratatui = "0.28"
crossterm = "0.28"

# HTTP
hyper = { version = "1", features = ["client", "http1", "http2"] }
http-body-util = "0.1"
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["trace"] }
axum = "0.7"

# Process/Shell
shell-words = "1.0"

# Hashing
sha2 = "0.10"

# Octocrab (GitHub API)
octocrab = "0.44"

# State
once_cell = "1.20"

# Testing utilities
assert_cmd = "2.0"
predicates = "3.0"

# Additional async
futures-util = "0.3"


# Dev dependencies
tokio-test = "0.4"
trybuild = "1"
proptest = "1.5"
loom = "0.7"
pretty_assertions = "1.4"
tempfile = "3.14"
serial_test = "3.0"
criterion = "0.5"
doc-comment = "0.3"

# Testing tools
cargo-deny = "0.16"
cargo-mutants = "0.8"
insta = { version = "1.40", features = ["yaml", "serde"] }

[workspace.package]
version = "0.5.0"
edition = "2021"
rust-version = "1.89"
authors = ["Source Control Plane Contributors"]
license = "MIT"
repository = "https://github.com/source-control-plane/scp"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "allow"
dead_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
# Zero unwrap law - enforced at crate level via lib.rs attributes
# Source code: deny unwrap/panic/todo/unimplemented
# Tests: allow anything

# Quality enforcement (with priority)
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }

# Specific allows
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
redundant_pub_crate = "allow"
type_complexity = "allow"
return_self_not_must_use = "allow"
trivially_copy_pass_by_ref = "allow"
map_unwrap_or = "allow"

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# Benchmark profile - optimized for accurate measurements
[profile.bench]
inherits = "release"
debug = true
strip = false
