# .mutants.toml
# Configuration for cargo-mutants

exclude_mutations = [
    "tracing::*",
    "log::*",
]

examine_globs = [
    "crates/session/src/domain/**/*.rs",
    "crates/queue/src/domain/**/*.rs",
    "crates/beads/src/domain/**/*.rs",
    "crates/workspace/src/domain/**/*.rs",
    "crates/core/src/domain/**/*.rs",
    "crates/stack/src/domain/**/*.rs",
    "crates/worktree/src/domain/**/*.rs",
]

exclude_re = [
    "impl Debug",
    "impl Display",
    "impl Serialize",
    "impl Deserialize",
    "#[derive]",
]
