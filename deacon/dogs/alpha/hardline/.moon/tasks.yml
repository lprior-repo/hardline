fmt:
  command: 'cargo fmt --all --check'
  toolchains:
    - rust
  options:
    runInCI: true

lint-src:
  command: 'cargo clippy --workspace -- -D warnings'
  toolchains:
    - rust
  options:
    runInCI: true

check:
  command: 'cargo check --workspace'
  toolchains:
    - rust
  options:
    runInCI: true

test:
  command: 'cargo nextest run --workspace'
  toolchains:
    - rust
  options:
    runInCI: true

build:
  command: 'cargo build --workspace --release'
  toolchains:
    - rust
  options:
    runInCI: true

ci:
  command: 'cargo clippy --workspace -- -D warnings && cargo nextest run --workspace && cargo llvm-cov --workspace --fail-under-lines 90'
  options:
    runInCI: true

dylint:
  command: 'cargo dylint --workspace'
  options:
    runInCI: false

coverage:
  command: 'cargo llvm-cov --workspace --fail-under-lines 90'
  options:
    runInCI: true

mutants:
  command: 'cargo mutants --workspace --timeout 120'
  options:
    runInCI: false

kani:
  command: 'cargo kani --workspace'
  options:
    runInCI: false

loom:
  command: 'RUSTFLAGS="--cfg loom" cargo test --workspace'
  options:
    runInCI: false

verify:
  command: './scripts/verify.sh'
  options:
    runInCI: true

verify-nightly:
  command: './scripts/verify-nightly.sh'
  options:
    runInCI: false
