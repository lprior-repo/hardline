[package]
name = "worktree"
version = "0.1.0"
edition = "2021"
description = "Git worktree management crate following DDD and functional Rust patterns"
license = "MIT"

[dependencies]
# Core functional stack
thiserror = { workspace = true }
anyhow = { workspace = true }

# Iteration utilities
itertools = { workspace = true }

# Pipe/tap operators
tap = { workspace = true }

# UUID
uuid = { workspace = true }

# Chrono for timestamps
chrono = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Path handling
pathdiff = { workspace = true }

# Async support
tokio = { workspace = true }

# SQLx for database operations
sqlx = { workspace = true, features = ["postgres", "sqlite", "runtime-tokio", "uuid", "chrono", "json", "macros"] }

# Git operations
git2 = { workspace = true }

# Async traits
async-trait = { workspace = true }

# Testing
proptest = { workspace = true }

[dev-dependencies]
tokio-test = { workspace = true }
insta = { workspace = true }
tempfile = { workspace = true }
futures = { workspace = true }

[[bin]]
name = "worktree-cli"
path = "src/main.rs"

[lib]
name = "worktree"
path = "src/lib.rs"
