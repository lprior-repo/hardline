# Isolate Rust Toolchain Configuration
# Pinned to stable 1.99.1 (released 2026-10-13). The codebase uses no
# nightly feature gates, so a stable pin ends nightly-drift CI failures.
# The same version is set in .github/workflows/ci.yml.

[toolchain]
channel = "1.99.1"

# Components
components = ["rustfmt", "clippy", "rust-analyzer"]

# Target support - add platforms as needed
targets = ["x86_64-unknown-linux-gnu"]
